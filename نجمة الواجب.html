<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نجمة الواجب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3FB;--card:#fff;--ink:#17324D;--mute:#5E7389;--line:#D3E1EE;--star:#FFC93C;--ok:#2FA77A;--warn:#E8604F;--pri:#2F6FB5;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B2A;--card:#182A3F;--ink:#EAF3FB;--mute:#9DB3C8;--line:#2A4059;--pri:#5B9BE0;--onpri:#0F1B2A}}
:root[data-theme="dark"]{--bg:#0F1B2A;--card:#182A3F;--ink:#EAF3FB;--mute:#9DB3C8;--line:#2A4059;--pri:#5B9BE0;--onpri:#0F1B2A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;font-weight:800;margin:0 0 4px}
h2{font-size:20px;font-weight:800;margin:0 0 12px}
p{margin:0 0 12px;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:var(--onpri);cursor:pointer;min-height:48px}
button.ghost{background:transparent;color:var(--pri);border:2px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--line);min-height:44px;padding:8px 14px}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.row>button{flex:0 0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.stars{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px}
.stars svg{width:26px;height:26px}
.hw{display:flex;flex-direction:column;gap:10px}
.hw .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute)}
.hw h3{margin:0;font-size:18px;font-weight:800}
.late{color:var(--warn);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.done{border-color:var(--star)}
.badge{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:800}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.pop{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,20,35,.6);z-index:20;padding:20px}
.pop.on{display:grid}
.pop .box{background:var(--card);border-radius:24px;padding:28px;text-align:center;max-width:340px;width:100%}
.pop svg{width:120px;height:120px;animation:spin .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.pop svg{animation:none}}
.hidden{display:none}
.toast{color:var(--warn);font-weight:700;margin-top:8px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.7 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#FFC93C" stroke="#D99A00" stroke-width="1.2" stroke-linejoin="round"/></symbol></svg>

<main class="wrap">

<section id="setup" class="hidden">
<h1>أهلاً بك في نجمة الواجب</h1>
<p>سجّل بياناتك مرة واحدة، وبعدها أضف واجباتك وحلّها واحصل على نجمة.</p>
<div class="card">
<label for="name">اسم الطالب</label>
<input id="name" autocomplete="off" placeholder="اكتب اسمك">
<label for="grade">المرحلة الدراسية</label>
<select id="grade"></select>
<label>المواد التي تدرسها</label>
<div class="chips" id="subjChips"></div>
<div class="row" style="margin-top:10px">
<input id="customSubj" placeholder="مادة أخرى">
<button class="ghost" id="addSubj" type="button">أضف مادة</button>
</div>
<div class="toast" id="setupErr" role="alert"></div>
<button id="saveProfile" type="button" style="width:100%;margin-top:16px">ابدأ</button>
</div>
</section>

<section id="home" class="hidden">
<div class="top">
<div><h1 id="hello"></h1><p id="gradeTxt" style="margin:0"></p></div>
<div class="stars"><svg><use href="#star"/></svg><span id="starCount">0</span></div>
</div>

<div class="card">
<h2>واجب جديد</h2>
<label for="hwSubj">المادة</label>
<select id="hwSubj"></select>
<label for="hwTitle">وصف الواجب</label>
<input id="hwTitle" autocomplete="off" placeholder="مثال: حل صفحة 45 تمارين 1 إلى 5">
<label for="hwDue">موعد التسليم</label>
<input id="hwDue" type="date">
<div class="toast" id="hwErr" role="alert"></div>
<button id="addHw" type="button" style="width:100%;margin-top:14px">أضف الواجب</button>
</div>

<h2>واجباتي</h2>
<div class="hw" id="list"></div>
<button class="ghost" id="editProfile" type="button" style="margin-top:20px">تعديل بياناتي</button>
</section>
</main>

<div class="pop" id="pop" role="dialog" aria-modal="true" aria-label="نجمة جديدة">
<div class="box">
<svg><use href="#star"/></svg>
<h2 id="popTitle" style="margin-top:12px">أحسنت!</h2>
<p>حصلت على نجمة جديدة لأنك وثّقت واجبك بالصور.</p>
<button id="popClose" type="button">متابعة</button>
</div>
</div>

<script>
const GRADES=["الصف الأول الابتدائي","الصف الثاني الابتدائي","الصف الثالث الابتدائي","الصف الرابع الابتدائي","الصف الخامس الابتدائي","الصف السادس الابتدائي","الصف الأول المتوسط","الصف الثاني المتوسط","الصف الثالث المتوسط","الصف الأول الثانوي","الصف الثاني الثانوي","الصف الثالث الثانوي"];
const BASE=["الرياضيات","اللغة العربية","العلوم","اللغة الإنجليزية","الدراسات الإسلامية","الاجتماعيات","الحاسب"];
const KEY="hw-helper-v1";
let state={profile:null,items:[]};
let draftSubj=new Set();
let customExtra=[];
const $=id=>document.getElementById(id);

function load(){try{const s=localStorage.getItem(KEY);if(s)state=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}

function show(id){["setup","home"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}

function renderChips(){
const all=[...BASE,...customExtra];
$("subjChips").innerHTML="";
all.forEach(s=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=s;
b.setAttribute("aria-pressed",draftSubj.has(s));
b.onclick=()=>{draftSubj.has(s)?draftSubj.delete(s):draftSubj.add(s);renderChips()};
$("subjChips").appendChild(b)});
}

function openSetup(){
const p=state.profile;
$("grade").innerHTML=GRADES.map(g=>`<option>${g}</option>`).join("");
if(p){$("name").value=p.name;$("grade").value=p.grade;draftSubj=new Set(p.subjects);customExtra=p.subjects.filter(s=>!BASE.includes(s))}
else{draftSubj=new Set();customExtra=[]}
renderChips();show("setup");
}

$("addSubj").onclick=()=>{const v=$("customSubj").value.trim();if(!v)return;if(!BASE.includes(v)&&!customExtra.includes(v))customExtra.push(v);draftSubj.add(v);$("customSubj").value="";renderChips()};

$("saveProfile").onclick=()=>{
const name=$("name").value.trim();
if(!name){$("setupErr").textContent="اكتب اسم الطالب أولاً.";return}
if(!draftSubj.size){$("setupErr").textContent="اختر مادة واحدة على الأقل.";return}
$("setupErr").textContent="";
state.profile={name,grade:$("grade").value,subjects:[...draftSubj]};
save();openHome();
};

function openHome(){
const p=state.profile;
$("hello").textContent="أهلاً يا "+p.name;
$("gradeTxt").textContent=p.grade;
$("hwSubj").innerHTML=p.subjects.map(s=>`<option>${s}</option>`).join("");
if(!$("hwDue").value){const d=new Date();d.setDate(d.getDate()+1);$("hwDue").value=d.toISOString().slice(0,10)}
renderList();show("home");
}

$("editProfile").onclick=openSetup;

$("addHw").onclick=()=>{
const title=$("hwTitle").value.trim();
if(!title){$("hwErr").textContent="اكتب وصف الواجب.";return}
$("hwErr").textContent="";
state.items.unshift({id:Date.now(),subj:$("hwSubj").value,title,due:$("hwDue").value,photos:[],star:false});
$("hwTitle").value="";
save();renderList();
};

function stars(){return state.items.filter(i=>i.star).length}

function renderList(){
$("starCount").textContent=stars();
const L=$("list");L.innerHTML="";
if(!state.items.length){L.innerHTML='<div class="empty card">ما عندك واجبات الآن. أضف أول واجب من الأعلى.</div>';return}
const today=new Date().toISOString().slice(0,10);
state.items.forEach(it=>{
const c=document.createElement("div");c.className="card"+(it.star?" done":"");
const late=!it.star&&it.due&&it.due<today;
c.innerHTML=`<div class="meta"><span>${esc(it.subj)}</span><span class="${late?"late":""}">${late?"متأخر · ":""}${it.due||""}</span></div>
<h3>${esc(it.title)}</h3>
<div class="thumbs"></div>`;
const th=c.querySelector(".thumbs");
it.photos.forEach(src=>{const im=document.createElement("img");im.src=src;im.alt="صورة الواجب";th.appendChild(im)});
const act=document.createElement("div");act.className="row";act.style.marginTop="10px";
if(it.star){act.innerHTML='<span class="badge"><svg width="22" height="22"><use href="#star"/></svg>تم الحصول على النجمة</span>'}
else{
const f=document.createElement("input");f.type="file";f.accept="image/*";f.multiple=true;f.className="hidden";
f.onchange=()=>addPhotos(it,f.files);
const b1=document.createElement("button");b1.type="button";b1.className="ghost";b1.textContent="صوّر الواجب";b1.onclick=()=>f.click();
const b2=document.createElement("button");b2.type="button";b2.textContent="احصل على نجمتك";b2.disabled=!it.photos.length;
b2.onclick=()=>{it.star=true;save();renderList();$("pop").classList.add("on");$("popClose").focus()};
act.append(f,b1,b2);
}
const del=document.createElement("button");del.type="button";del.className="ghost";del.textContent="حذف";
del.onclick=()=>{state.items=state.items.filter(x=>x.id!==it.id);save();renderList()};
act.appendChild(del);
c.appendChild(act);
if(!it.star&&!it.photos.length){const n=document.createElement("p");n.style.margin="8px 0 0";n.style.fontSize="14px";n.textContent="أضف صورة واحدة على الأقل لتفتح زر النجمة.";c.appendChild(n)}
L.appendChild(c);
});
}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function shrink(file){return new Promise(res=>{
const r=new FileReader();
r.onload=()=>{const im=new Image();im.onload=()=>{
const k=Math.min(1,720/Math.max(im.width,im.height));
const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
res(c.toDataURL("image/jpeg",.6))};im.onerror=()=>res(null);im.src=r.result};
r.onerror=()=>res(null);r.readAsDataURL(file)})}

async function addPhotos(it,files){
for(const f of files){const d=await shrink(f);if(d)it.photos.push(d)}
if(!save()){it.photos.length=Math.max(0,it.photos.length-files.length);alert("المساحة امتلأت. احذف واجبات قديمة ثم حاول مرة أخرى.")}
renderList();
}

$("popClose").onclick=()=>$("pop").classList.remove("on");

load();
state.profile?openHome():openSetup();
</script>
</body>
</html>
